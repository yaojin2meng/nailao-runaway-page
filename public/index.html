  <script>
    (function () {
      var docEl = document.documentElement;
      var metaTheme = document.getElementById('meta-theme-color');
      var toggleBtn = document.getElementById('theme-toggle');

      function isDarkNow() {
        var attr = docEl.getAttribute('data-theme');
        if (attr === 'dark') return true;
        if (attr === 'light') return false;
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      function applyTheme(dark, persist) {
        docEl.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (metaTheme) metaTheme.setAttribute('content', dark ? '#1b0e04' : '#faf4de');
        if (persist) {
          try { localStorage.setItem('nailao-theme', dark ? 'dark' : 'light'); } catch (e) {}
        }
      }

      if (toggleBtn) {
        toggleBtn.addEventListener('click', function () {
          applyTheme(!isDarkNow(), true);
        });
      }

      var toastEl = document.getElementById('toast');
      var toastTimer = null;

      function toast(text) {
        if (!toastEl) return;
        toastEl.textContent = text;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
      }

      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      function copyText(text) {
        return new Promise(function (resolve) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
              function () { resolve(true); },
              function () { resolve(fallbackCopy(text)); }
            );
          } else {
            resolve(fallbackCopy(text));
          }
        });
      }

      var consoleEl = document.getElementById('console');
      var outEl = document.getElementById('out');
      var statusEl = document.getElementById('status');
      var metaEl = document.getElementById('meta');
      var closeBtn = document.getElementById('console-close');

      if (closeBtn && consoleEl) {
        closeBtn.addEventListener('click', function () {
          consoleEl.hidden = true;
        });
      }

      function pretty(text) {
        try { return JSON.stringify(JSON.parse(text), null, 2); } catch (e) { return text; }
      }

      function now() {
        return (window.performance && performance.now) ? performance.now() : Date.now();
      }

      function setBusy(busy) {
        Array.prototype.forEach.call(document.querySelectorAll('[data-test]'), function (el) {
          el.disabled = busy;
        });
      }

      document.addEventListener('click', function (event) {
        var target = event.target;
        if (!target || !target.closest) return;

        var copyBtn = target.closest('[data-copy]');
        if (copyBtn) {
          event.preventDefault();
          var text = copyBtn.getAttribute('data-copy');
          if (!text) return;

          copyText(text).then(function (ok) {
            var orig = copyBtn.getAttribute('data-orig') || copyBtn.textContent;
            copyBtn.setAttribute('data-orig', orig);
            copyBtn.textContent = ok ? '已复制' : '复制失败';
            copyBtn.classList.toggle('done', ok);
            toast(ok ? '已复制 ' + text : '复制失败，请手动复制');
            setTimeout(function () {
              copyBtn.textContent = orig;
              copyBtn.classList.remove('done');
            }, 1500);
          });
          return;
        }

        var testBtn = target.closest('[data-test]');
        if (!testBtn) return;

        var kind = testBtn.getAttribute('data-test');
        var url = '/v1';
        var init = {};

        if (kind === 'models') {
          url = '/v1/models';
          init = { headers: { authorization: 'Bearer sk-nailao' } };
        } else if (kind === 'anthropic') {
          url = '/v1/messages';
          init = {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-api-key': 'sk-ant-nailao',
              'anthropic-version': '2023-06-01'
            },
            body: JSON.stringify({
              model: 'castorice (https://castorice.shop)',
              max_tokens: 128,
              messages: [{ role: 'user', content: '还在吗？' }]
            })
          };
        } else {
          url = '/v1';
          init = {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              authorization: 'Bearer sk-nailao'
            },
            body: JSON.stringify({
              model: 'castorice (https://castorice.shop)',
              messages: [{ role: 'user', content: '还在吗？' }]
            })
          };
        }

        setBusy(true);
        consoleEl.hidden = false;
        statusEl.classList.remove('err');
        statusEl.textContent = '请求中…';
        metaEl.textContent = url;
        outEl.textContent = '…';
        var started = now();

        fetch(url, init)
          .then(function (res) {
            return res.text().then(function (bodyText) {
              statusEl.textContent = 'HTTP ' + res.status;
              statusEl.classList.toggle('err', !res.ok);
              metaEl.textContent = url + ' · ' + Math.round(now() - started) + 'ms';
              outEl.textContent = pretty(bodyText);
            });
          })
          .catch(function (err) {
            statusEl.textContent = '请求未连接';
            statusEl.classList.add('err');
            metaEl.textContent = url;
            outEl.textContent = '无法连接接口：' + (err && err.message ? err.message : err) +
              '\n\n部署到 Cloudflare Workers 或运行 npm run dev 后即可在线查看真实响应。';
          })
          .then(function () {
            setBusy(false);
          });
      });
    })();
  </script>
</body>
</html>
